<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Talk</title>
  <script src="../site.config.js"></script>
  <script src="../shared/site.js"></script>
  <link rel="stylesheet" href="../shared/site.css">
</head>
<body class="talk-page">
  <!-- The slide stays pinned at the top and follows what you're reading (or the speaker, when live). -->
  <div class="talk-stage">
    <div class="talk-stage-inner">
      <div class="deck-frame"><iframe id="stage-deck" src="../slides/?embed" title="Slides" allow="fullscreen; autoplay"></iframe></div>
      <div class="stage-bar">
        <button class="btn" type="button" data-go="prev" aria-label="Previous" disabled>‹</button>
        <button class="btn" type="button" data-go="next" aria-label="Next" disabled>›</button>
        <span class="pos" aria-live="polite"></span>
        <button class="btn live-btn" type="button" hidden>Rejoin live</button>
      </div>
    </div>
  </div>
  <main class="talk-main">
    <section class="talk-hero">
      <h1><a href="../" style="text-decoration:none" data-site="title"></a></h1>
      <p data-site="venue"></p>
    </section>
    <div id="transcript"><p class="loading">Loading</p></div>
  </main>
  <script src="../slides/vendor/marked.js"></script>
  <script src="../slides/js/mdeck.js"></script>
  <script src="../slides/js/live.js"></script>
  <script src="../slides/js/talk.js"></script>
</body>
</html>
