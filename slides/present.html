<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Presenter</title>
  <meta name="robots" content="noindex">
  <script src="../site.config.js"></script>
  <script src="../shared/site.js"></script>
  <link rel="stylesheet" href="../shared/site.css">
  <link rel="stylesheet" href="css/present.css">
</head>
<!--
  Press P on the slides for this view, S for the speaker view (the script, large); the same
  keys switch between them here. Keys: arrows or space to move, A to turn asking on or off,
  B for backups, T for light, dark or system, click the time to reset it.
-->
<body class="view-presenter">
  <main class="pv">
    <section class="pv-current">
      <div class="pv-frame"><iframe title="Current slide" data-role="current" tabindex="-1"></iframe></div>
      <div class="pv-meta"><span class="pos"></span><span class="title"></span></div>
    </section>
    <section class="pv-next">
      <div class="pv-frame"><iframe title="Next" data-role="next" tabindex="-1"></iframe><div class="end" hidden>End</div></div>
      <div class="pv-timer" title="Click to reset"><b class="elapsed">0:00</b><span class="pace"></span></div>
    </section>
    <section class="pv-notes"><div class="notes"></div></section>
    <section class="pv-questions" hidden><ol></ol></section>
  </main>
  <div class="pv-toast" hidden></div>
  <script src="vendor/marked.js"></script>
  <script src="js/mdeck.js"></script>
  <script src="js/live.js"></script>
  <script src="js/present.js"></script>
</body>
</html>
