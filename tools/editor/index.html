<!doctype html>
<html lang="en" class="always-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Editor</title>
  <!-- Relative paths in layouts resolve as they do on the slides. -->
  <base href="/slides/">
  <style>
    #gate { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 520px; margin: 18vh auto; padding: 0 24px; color: #1d1d1f; }
    #gate code { font: 14px ui-monospace, Menlo, monospace; background: rgba(0,0,0,.05); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- Nothing below loads unless the dev server recognizes this browser. -->
  <div id="gate" hidden>
    <b>The editor needs dev mode.</b>
    <p>Run <code>npm run dev</code> on your computer and open the link it prints in your terminal. The published site can't be edited.</p>
  </div>
  <script>
    fetch("/__dev/session", { cache: "no-store" }).then(function (r) {
      if (r.status !== 204) throw 0;
      var load = function (src) { return new Promise(function (ok) { var s = document.createElement("script"); s.src = src; s.onload = ok; document.head.appendChild(s); }); };
      [["stylesheet", "/shared/site.css"], ["stylesheet", "/slides/css/deck.css"], ["stylesheet", "/tools/editor/editor.css"]].forEach(function (l) {
        var el = document.createElement("link"); el.rel = l[0]; el.href = l[1]; document.head.appendChild(el);
      });
      ["/site.config.js", "/shared/site.js", "/slides/vendor/marked.js", "/slides/vendor/qrcode.js", "/slides/js/mdeck.js", "/tools/editor/editor.js"].reduce(function (p, src) { return p.then(function () { return load(src); }); }, Promise.resolve());
    }).catch(function () { document.getElementById("gate").hidden = false; });
  </script>
</body>
</html>
